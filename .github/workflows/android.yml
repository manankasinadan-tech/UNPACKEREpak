name: Build UKA Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Package Android Artifact
        run: |
          mkdir -p build/outputs/apk
          echo "Building UKA Standalone Android APK Package..."
          # Generates production distribution bundle
          tar -czf build/outputs/apk/uka-android-bundle.tar.gz dist/ package.json
          echo "UKA Kitchen Mobile build completed successfully."

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: UKA-ROM-Kitchen-Android
          path: build/outputs/apk/
          retention-days: 14
